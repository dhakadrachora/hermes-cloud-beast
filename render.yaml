services:
  - type: web
    name: hermes-cloud-beast
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_BASE
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8080
